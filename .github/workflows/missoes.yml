# Cada PR do DREND aparece sozinho nas Missões: aberto = em andamento, mergeado = feito.
# Sem segredo: o GitHub assina um token OIDC que a /api/missao confere (api/_github.js).
name: Missões
on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
permissions:
  id-token: write
  contents: read
jobs:
  registrar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Avisar o DREND
        env:
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_LINK: ${{ github.event.pull_request.html_url }}
          PR_MERGEADO: ${{ github.event.pull_request.merged }}
          PR_RASCUNHO: ${{ github.event.pull_request.draft }}
          ACAO: ${{ github.event.action }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=drend.vercel.app" | jq -r .value)
          if [ "$ACAO" = "closed" ]; then
            FASE=feito
            if [ "$PR_MERGEADO" = "true" ]; then TEXTO="No ar: mergeado na main."; else TEXTO="Fechado sem merge."; fi
          else
            FASE=agora
            if [ "$PR_RASCUNHO" = "true" ]; then TEXTO="Rascunho aberto."; else TEXTO="PR aberto, esperando merge."; fi
          fi
          jq -n --arg n "$PR_NUMERO" --arg t "$PR_TITULO" --arg r "$PR_LINK" --arg f "$FASE" --arg x "$TEXTO" \
            '{missao:"drend", agente:"drend", tipo:"item", chave:("pr-"+$n), fase:$f, titulo:($t|.[0:200]), texto:$x, ref:$r}' > evento.json
          curl -sS --fail-with-body -X POST https://drend.vercel.app/api/missao \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @evento.json
